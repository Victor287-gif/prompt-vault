domains:
  common:
    description: 跨领域公共知识
    direct_types: [glossaries]
  contrib:
    description: 社区贡献的工程知识
    direct_types: []
  ops:
    description: 算子语义、设计、实现、调试与优化
    direct_types: []
    precreate_routes: true
  graph:
    description: 图编译和图优化
    direct_types: []
  model:
    description: 模型推理、训练、空间智能与具身智能
    direct_types: []
    precreate_routes: true
  runtime:
    description: CANN Runtime、API 与故障诊断
    direct_types: [concepts, apis, runbooks]

technologies:
  ascendc:
    type: language
    description: Ascend C 算子编程语言与 API
    domains: [ops, contrib]
  triton:
    type: dsl
    description: Triton 算子编程 DSL
    domains: [ops]
  tilelang:
    type: dsl
    description: TileLang 算子编程 DSL
    domains: [ops]
  pypto:
    type: dsl
    description: PyPTO 算子编程 DSL
    domains: [ops]
  torch_compile:
    type: framework
    description: PyTorch torch.compile 图编译技术栈
    domains: [graph]
  ge:
    type: engine
    description: Graph Engine 图执行与优化技术栈
    domains: [graph]

scopes:
  shared:
    description: 同一领域内不依赖具体技术栈的知识
    domains: [ops, graph]
  platforms:
    description: 产品、芯片、NPU 架构和兼容关系
    domains: [common]
  toolchains:
    description: CANN 环境、构建和工具链
    domains: [common]
  observability:
    description: Profiling、日志和指标
    domains: [common]
  inference:
    description: 模型推理知识
    domains: [model]
  training:
    description: 模型训练知识
    domains: [model]
  spatial:
    description: 空间智能模型与算法知识
    domains: [model]
  embodied:
    description: 具身智能模型与系统知识
    domains: [model]

local_sources:
  ops_cv:
    description: 固定到算子知识来源提交的 CANN ops-cv 源码
    kind: git
    root: cann-ops-raw/ascendc/ops-cv
    fetch_script: get_resources.sh
    repository: https://gitcode.com/cann/ops-cv
    revisions:
      - bb717d075d129fd1fc7b96b2886824a1d153ed2f
  ops_math:
    description: 固定到算子知识来源提交的 CANN ops-math 源码
    kind: git
    root: cann-ops-raw/ascendc/ops-math
    fetch_script: get_resources.sh
    repository: https://gitcode.com/cann/ops-math
    revisions:
      - 165d41f02a43a62324b434cb6bda7c533b14da3e
  ops_nn:
    description: 固定到算子知识来源提交的 CANN ops-nn 源码
    kind: git
    root: cann-ops-raw/ascendc/ops-nn
    fetch_script: get_resources.sh
    repository: https://gitcode.com/cann/ops-nn
    revisions:
      - 955f8b33985b6d72989ebff341bb9c2c564a51bc
  ops_transformer:
    description: 固定到算子知识来源提交的 CANN ops-transformer 源码
    kind: git
    root: cann-ops-raw/ascendc/ops-transformer
    fetch_script: get_resources.sh
    repository: https://gitcode.com/cann/ops-transformer
    revisions:
      - be33d95bb755cedec3108f70805c1874d1792540
  cann_docs_raw:
    description: 从官方持续更新归档恢复的 Ascend C 文档
    root: cann-docs-raw
    fetch_script: get_resources.sh
    archive_url: https://ascend-ci.obs.cn-north-4.myhuaweicloud.com/package/doc/Ascend-cann-docs-examples.tar.gz
    mirror:
      source_root: asc-devkit/docs/zh
      api_roots: [api]
      guide_roots: [guide]
      guide_files: [quick_start.md, asc_how_to_choose_api.md]
      exclude: [guide/figures/image_compression_guide.md]
      navigation_policy: index_only
      api_operator_display_limit: 10
      omit_section_title_contains: [产品支持情况]
      upstream_repository: https://gitcode.com/cann/asc-devkit
      upstream_revision: 639b2b5c1031188107d23d785d52b935f1b4f13b
      ambiguous_relation_symbols:
        - Alloc
        - Commit
        - DataType
        - Destroy
        - Extract
        - Finalize
        - Get
        - GetDataPtr
        - GetDim
        - GetIndex
        - Init
        - InitValue
        - Load
        - Query
        - RoundMode
        - Scalar
        - ScalarList
        - SetDim
        - SetShape
        - SetTail
        - SetTiling
        - Store
        - Tensor
        - Version
        - assert
        - cast
        - ceil_div
        - ceil_division
        - conditional
        - end
        - fill
        - get_tensor_c
        - load
        - log
        - max
        - min
        - or
        - rank
        - select
        - shape
        - size
        - slice
        - sqrt
        - store
        - stride
        - tensor
        - transpose
        - tuple
        - wait
        - workspace
        - xor
      reviewed_relation_rejections:
        - api: knowledge/ops/ascendc/apis/simt_api/math_functions/float_math_functions/expf.md
          operator: knowledge/ops/ascendc/operators/aclnn/nn/foreach/foreach_expm1_950.md
        - api: knowledge/ops/ascendc/apis/simt_api/math_functions/float_math_functions/isfinite.md
          operator: knowledge/ops/ascendc/operators/aclnn/nn/activation/hardsigmoid_backward_950.md
        - api: knowledge/ops/ascendc/apis/simt_api/math_functions/float_math_functions/isfinite.md
          operator: knowledge/ops/ascendc/operators/aclnn/nn/activation/swiglu_group_quant_950.md
        - api: knowledge/ops/ascendc/apis/simt_api/math_functions/float_math_functions/isfinite.md
          operator: knowledge/ops/ascendc/operators/direct/math/math/exp_950.md
        - api: knowledge/ops/ascendc/apis/simd_api/basic_api/reg_vector_compute/type_conversion/cast.md
          operator: knowledge/ops/ascendc/operators/aclnn/math/math/logical_not_950.md
        - api: knowledge/ops/ascendc/apis/simd_api/basic_api/data_structures/global_tensor/set_l2_cache_hint.md
          operator: knowledge/ops/ascendc/operators/aclnn/transformer/mhc/mhc_post_950.md
        - api: knowledge/ops/ascendc/apis/simd_api/adv_api/math_compute/bitwise_or_interface/bitwise_or.md
          operator: knowledge/ops/ascendc/operators/aclnn/math/math/bitwise_or_tensor_950.md
        - api: knowledge/ops/ascendc/apis/simd_api/adv_api/activation_functions/soft_max_interface/softmax_grad.md
          operator: knowledge/ops/ascendc/operators/aclnn/nn/activation/softmax_backward_950.md
        - api: knowledge/ops/ascendc/apis/simd_api/adv_api/reduction_operations/reduce_all_interface/reduce_all.md
          operator: knowledge/ops/ascendc/operators/aclnn/math/math/all_950.md
        - api: knowledge/ops/ascendc/apis/simd_api/basic_api/aux_data_structures/tensor_desc/get_data_ptr.md
          operator: knowledge/ops/ascendc/operators/aclnn/nn/foreach/foreach_tan_950.md
        - api: knowledge/ops/ascendc/apis/utils_api/cpp_stdlib/math_functions/ceil_div.md
          operator: knowledge/ops/ascendc/operators/direct/nn/activation/sigmoid_950.md
        - api: knowledge/ops/ascendc/apis/utils_api/cpp_stdlib/math_functions/ceil_division.md
          operator: knowledge/ops/ascendc/operators/direct/nn/activation/sigmoid_950.md
        - api: knowledge/ops/ascendc/apis/simd_api/adv_api/activation_functions/sigmoid_interface/sigmoid.md
          operator: knowledge/ops/ascendc/operators/aclnn/nn/activation/inplace_sigmoid.md
        - api: knowledge/ops/ascendc/apis/utils_api/prototype_register_management/op_def/aicpu.md
          operator: knowledge/ops/ascendc/operators/aclnn/transformer/mc2/allto_all_matmul.md

paths:
  operator_call_modes: [aclnn, direct]
  operator_categories:
    cv: [image, objdetect]
    math: [conversion, math, random]
    nn: [activation, conv, foreach, index, loss, matmul, norm, optim, pooling, quant, rnn, vfusion]
    transformer: [attention, ffn, gmm, mc2, mhc, moe, posembedding]
  runbook_areas: [compilation, runtime, precision, performance, validations]

platforms:
  a2:
    description: Atlas A2 系列
  a3:
    description: Atlas A3 系列
  "950":
    description: Ascend 950 系列（包含旧称 Atlas A5）
