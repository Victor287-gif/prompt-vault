common_required:
  - type
  - title
  - description
  - tags
  - status
  - sources
  - created_at
  - updated_at

profiles:
  concepts:
    okf_type: Concept
    required: [platforms]
    optional: [cann_versions, aliases, verified, replaced_by]
  apis:
    okf_type: API
    required: [platforms]
    optional: [cann_versions, source_headers, aliases, verified, replaced_by]
  examples:
    okf_type: Example
    required: [platforms]
    optional: [cann_versions, verified, replaced_by]
  guides:
    okf_type: Guide
    required: [platforms]
    optional: [cann_versions, aliases, verified, replaced_by]
  operators:
    okf_type: Operator
    required: [platforms]
    optional: [cann_versions, verified, replaced_by]
  optimizations:
    okf_type: Optimization
    required: [platforms]
    optional: [cann_versions, verified, replaced_by]
  runbooks:
    okf_type: Runbook
    required: [platforms]
    optional: [aliases, verified, replaced_by]
  interoperability:
    okf_type: Interoperability
    required: [platforms, source_technology, target_technology]
    optional: [cann_versions, verified, replaced_by]
  glossaries:
    okf_type: Glossary
    required: []
    optional: [aliases, verified, replaced_by]
